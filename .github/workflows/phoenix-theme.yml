name: Phoenix temasini uygula
on: workflow_dispatch
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PhoenixLauncher.zip
      - run: python3 phoenix/phoenix_overlay/apply_phoenix.py
      - run: rm -rf phoenix PhoenixLauncher.zip
      - run: |
          git config user.name "phoenix-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Phoenix Launcher teması" || echo "değişiklik yok"
          git push
